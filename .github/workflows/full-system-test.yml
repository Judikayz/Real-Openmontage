name: Full System Test
# Real Worker + real runner + REAL OpenCode with a real model + real OpenMontage. Publishes a report to the ci-results branch.
on:
  workflow_dispatch:
    inputs:
      model:  { description: "OpenCode provider/model", required: false, default: "opencode/big-pickle", type: string }
      prompt: { description: "Override the video request (use {pid} for the project id)", required: false, type: string }
permissions:
  contents: write
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TEST_MODEL: ${{ inputs.model }}
      TEST_PROMPT: ${{ inputs.prompt }}
      REPORT_DIR: /tmp/report
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt -r requirements-orchestrator.txt
      - run: npm install -g opencode-ai@1.19.5 && opencode --version
      - run: cd worker && npm ci --no-audit --no-fund && scripts/prepare-assets.sh
      - run: cd remotion-composer && npm ci --no-audit --no-fund
      - name: Run full-system test
        run: python scripts/ci/full_system_test.py
      - name: Publish report
        if: always()
        run: |
          [ -f /tmp/report/summary.txt ] && scripts/ci/annotate.sh "full-system-summary" /tmp/report/summary.txt || echo "no summary produced"
          cd /tmp/report && git init -q -b ci-results && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -q -m "full system test report ${{ github.run_id }}" && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
