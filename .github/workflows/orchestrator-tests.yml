name: Orchestrator Tests
on:
  push:
    branches: [main]
    paths: ["worker/**", "orchestrator/**", "director/**", "runner/**", "requirements-*.txt", "tests/orchestrator/**", "tests/director/**", "backlot/**", ".github/workflows/**"]
  pull_request:
    paths: ["worker/**", "orchestrator/**", "director/**", "runner/**", "requirements-*.txt", "tests/orchestrator/**", "tests/director/**", "backlot/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "requirements-orchestrator.txt" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-orchestrator.txt
      - run: python -m pytest tests/orchestrator tests/director -q --ignore=tests/orchestrator/test_worker_schedules.py
  worker-e2e:
    # Same end-to-end suite, but against the Cloudflare Worker running on workerd with local D1 + R2.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "requirements-orchestrator.txt" }
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-orchestrator.txt
      - run: cd worker && npm ci --no-audit --no-fund && scripts/prepare-assets.sh
      - run: cd worker && node --test test/schedule.test.mjs
      - run: E2E_BACKEND=worker python -m pytest tests/orchestrator/test_e2e.py -q
      - name: Scheduling tests (Worker + cron)
        run: |
          set -o pipefail
          python -m pytest tests/orchestrator/test_worker_schedules.py -q --tb=short -rf 2>&1 | tee /tmp/sched.log
      - name: Publish failure summary
        if: failure()
        run: tail -c 5500 /tmp/sched.log > /tmp/sched.tail && scripts/ci/annotate.sh "schedule-tests-tail" /tmp/sched.tail
