name: Orchestrator Tests
on:
  push:
    branches: [main]
    paths: ["orchestrator/**", "runner/**", "tests/orchestrator/**", "backlot/**", ".github/workflows/**"]
  pull_request:
    paths: ["orchestrator/**", "runner/**", "tests/orchestrator/**", "backlot/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "requirements-orchestrator.txt" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-orchestrator.txt
      - run: python -m pytest tests/orchestrator -q
