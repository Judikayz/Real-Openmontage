name: Health Check
on:
  workflow_dispatch:
    inputs:
      backend_url: { description: "Backend URL to report to (optional)", required: false, type: string }
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          load: true
          tags: om-runner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify toolchain inside the container
        env:
          BACKEND_URL: ${{ inputs.backend_url || vars.ORCH_BACKEND_URL }}
          ORCH_RUNNER_SECRET: ${{ secrets.ORCH_RUNNER_SECRET }}
        run: scripts/ci/run_in_container.sh python -m runner.health
      - name: Smoke-test ffmpeg render + QC in the container
        run: |
          scripts/ci/run_in_container.sh sh -c '
            ffmpeg -y -v error -f lavfi -i testsrc=size=640x360:rate=24:duration=2 -f lavfi -i sine=duration=2 -shortest -pix_fmt yuv420p /tmp/t.mp4 &&
            python -c "from runner.qc import qc_video; from pathlib import Path; r=qc_video(Path(\"/tmp/t.mp4\")); print(r); raise SystemExit(0 if r[\"ok\"] else 1)"'
